{% extends "base.html" %}

{% block title %}{{ author }} - {{ SITENAME }}{% endblock %}

{% block content %}
<h1 class="archive-title">Posts by {{ author }}</h1>

<section id="content">
    {% for article in articles %}
    <article style="margin-bottom: 2rem;">
        <header>
            <h2 class="entry-title">
                <a href="{{ SITEURL }}/{{ article.url }}" rel="bookmark">{{ article.title }}</a>
            </h2>
        </header>

        <footer class="post-info">
            <abbr class="published" title="{{ article.date.isoformat() }}">
                {{ article.locale_date }}
            </abbr>
        </footer>

        <div class="summary">
            {{ article.summary }}
        </div>

        <a href="{{ SITEURL }}/{{ article.url }}" class="read-more">Read More →</a>
    </article>
    {% endfor %}
</section>
{% endblock %}
